<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0B2154" />
    <title>Server əlçatan deyil — DoctorEngine.az</title>
    <!-- Bu səhifə service worker (sw.js) tərəfindən göstərilir: server işləmir, internet yoxdur
         və ya server 502/503/504 qaytarır. Heç bir xarici fayldan asılı deyil. -->
    <style>
        :root { --p: #D81324; --pd: #b00f1d; --n: #0B2154; --t: #1d2433; --m: #6b7486; --b: #e5e8ef; --bg: #f4f6fa; }
        * { box-sizing: border-box; }
        html, body { margin: 0; min-height: 100%; }
        body {
            display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh;
            background:
                radial-gradient(circle at 12% 0%, rgba(216, 19, 36, .08), transparent 38%),
                radial-gradient(circle at 100% 100%, rgba(11, 33, 84, .09), transparent 42%),
                radial-gradient(circle at 1px 1px, rgba(11, 33, 84, .06) 1px, transparent 0) 0 0 / 24px 24px, var(--bg);
            color: var(--t); font-family: "Ubuntu", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        header { padding: 22px clamp(16px, 4vw, 48px); }
        .brand { display: inline-flex; align-items: center; gap: 10px; color: var(--p); font: 700 24px/1 "Barlow", system-ui, sans-serif; text-decoration: none; }
        .brand svg { width: 38px; height: 38px; }
        main { flex: 1; display: grid; place-items: center; padding: 8px 16px 48px; }
        .card {
            width: 100%; max-width: 540px; padding: clamp(28px, 5vw, 46px) clamp(20px, 5vw, 42px);
            border: 1px solid var(--b); border-radius: 24px; background: rgba(255, 255, 255, .94);
            box-shadow: 0 24px 60px rgba(11, 33, 84, .12); text-align: center; animation: rise .5s ease both;
        }
        @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
        .ico {
            position: relative; width: 96px; height: 96px; margin: 0 auto 22px; border-radius: 50%;
            display: grid; place-items: center; background: linear-gradient(135deg, var(--p), var(--pd));
            box-shadow: 0 16px 34px rgba(216, 19, 36, .32);
        }
        .ico svg { width: 46px; height: 46px; }
        .ico::after {
            content: ""; position: absolute; inset: -8px; border-radius: 50%;
            border: 2px solid rgba(216, 19, 36, .25); animation: pulse 2.2s ease-out infinite;
        }
        @keyframes pulse { from { transform: scale(.9); opacity: 1; } to { transform: scale(1.25); opacity: 0; } }
        h1 { margin: 0 0 10px; color: var(--n); font: 700 clamp(24px, 5vw, 31px)/1.15 "Barlow", system-ui, sans-serif; }
        p { max-width: 420px; margin: 0 auto; color: var(--m); font-size: 15.5px; line-height: 1.55; }
        .status {
            display: inline-flex; align-items: center; gap: 8px; margin: 18px 0 24px; padding: 6px 12px;
            border-radius: 999px; background: #fff6e5; color: #92400e; font-size: 13px;
        }
        .status i { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; animation: blink 1.2s infinite; }
        .status.is-offline { background: #fdecee; color: #991b1b; }
        .status.is-offline i { background: var(--p); }
        @keyframes blink { 50% { opacity: .3; } }
        .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px;
            border: 1px solid transparent; border-radius: 12px; font: 500 15px/1 inherit; font-family: inherit;
            text-decoration: none; cursor: pointer;
        }
        .btn-p { background: var(--p); color: #fff; box-shadow: 0 8px 20px rgba(216, 19, 36, .3); }
        .btn-p:hover { background: var(--pd); }
        .btn-l { border-color: var(--b); background: #fff; color: var(--n); }
        .btn-l:hover { border-color: var(--n); }
        .btn:disabled { opacity: .6; cursor: default; }
        .hint { margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--b); color: var(--m); font-size: 13px; }
        @media (max-width: 480px) { .actions { flex-direction: column; } .btn { width: 100%; } }
        @media (prefers-reduced-motion: reduce) { .card, .ico::after, .status i { animation: none; } }
    </style>
</head>
<body>
    <header>
        <a class="brand" href="/">
            <svg viewBox="0 0 38 38" aria-hidden="true"><rect width="38" height="38" rx="11" fill="#D81324" /><path fill="#fff" d="M24.6 10.2a5.6 5.6 0 0 0-6.9 7.1l-7.2 7.2a1.9 1.9 0 0 0 2.7 2.7l7.2-7.2a5.6 5.6 0 0 0 7.1-6.9l-3.3 3.3-2.6-.6-.6-2.6z" /></svg>
            DoctorEngine.az
        </a>
    </header>

    <main>
        <section class="card" aria-labelledby="t">
            <div class="ico" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="7" rx="2" /><rect x="3" y="13" width="18" height="7" rx="2" /><path d="M7 7.5h.01M7 16.5h.01" /><path d="M2 2l20 20" /></svg>
            </div>

            <h1 id="t" data-t="title">Server hazırda cavab vermir</h1>
            <p id="msg">Sayt müvəqqəti əlçatan deyil — texniki işlər aparılır və ya server yenidən başladılır. Bir azdan yenidən cəhd edin.</p>

            <div class="status" id="status" role="status"><i></i><span data-t="checking">Bağlantı avtomatik yoxlanılır…</span></div>

            <div class="actions">
                <button type="button" class="btn btn-p" id="retry">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5" /></svg>
                    <span data-t="retry">Yenidən cəhd et</span>
                </button>
                <a class="btn btn-l" href="tel:+994773051319" data-t="call">Zəng et</a>
            </div>

            <p class="hint" data-t="hint">Server bərpa olunan kimi səhifə avtomatik yenilənəcək.</p>
        </section>
    </main>

    <script>
        (function () {
            // Dil: saytdakı seçim (de_lang kukisi), yoxdursa azərbaycanca
            var I18N = {
                en: { doc: "Server unavailable", title: "The server is not responding right now", msg: "The site is temporarily unavailable — maintenance is in progress or the server is restarting. Please try again shortly.", checking: "Checking the connection automatically…", retry: "Try again", call: "Call", hint: "The page will reload automatically once the server is back.", offline: "No internet connection", offlineMsg: "Your device is not connected to the internet. Check Wi-Fi or mobile data — the page will open by itself once you are back online." },
                ru: { doc: "Сервер недоступен", title: "Сервер сейчас не отвечает", msg: "Сайт временно недоступен — идут технические работы или сервер перезапускается. Попробуйте чуть позже.", checking: "Соединение проверяется автоматически…", retry: "Повторить", call: "Позвонить", hint: "Страница обновится автоматически, как только сервер заработает.", offline: "Нет подключения к интернету", offlineMsg: "Устройство не подключено к интернету. Проверьте Wi-Fi или мобильный интернет — страница откроется сама после восстановления связи." },
                tr: { doc: "Sunucuya ulaşılamıyor", title: "Sunucu şu anda yanıt vermiyor", msg: "Site geçici olarak erişilemiyor — bakım yapılıyor veya sunucu yeniden başlatılıyor. Lütfen biraz sonra tekrar deneyin.", checking: "Bağlantı otomatik olarak kontrol ediliyor…", retry: "Tekrar dene", call: "Ara", hint: "Sunucu geri geldiğinde sayfa otomatik olarak yenilenecek.", offline: "İnternet bağlantısı yok", offlineMsg: "Cihazınız internete bağlı değil. Wi-Fi veya mobil veriyi kontrol edin — bağlantı gelince sayfa kendiliğinden açılacak." }
            };
            var lang = (document.cookie.match(/(?:^|;\s*)de_lang=(\w+)/) || [])[1];
            var t = I18N[lang] || null;
            if (t) {
                document.documentElement.lang = lang;
                document.title = t.doc + " — DoctorEngine.az";
                document.getElementById("msg").textContent = t.msg;
                [].forEach.call(document.querySelectorAll("[data-t]"), function (el) { el.textContent = t[el.getAttribute("data-t")]; });
            }

            var status = document.getElementById("status");
            var text = status.querySelector("span");
            var msg = document.getElementById("msg");
            var retry = document.getElementById("retry");

            function render() {
                if (!navigator.onLine) {
                    status.classList.add("is-offline");
                    text.textContent = t ? t.offline : "İnternet bağlantısı yoxdur";
                    msg.textContent = t ? t.offlineMsg : "Cihazınız internetə qoşulmayıb. Wi-Fi və ya mobil interneti yoxlayın — bağlantı bərpa olunanda səhifə özü açılacaq.";
                } else {
                    status.classList.remove("is-offline");
                    text.textContent = t ? t.checking : "Bağlantı avtomatik yoxlanılır…";
                }
            }

            // Server cavab verirsə — əsl səhifəyə qayıt
            function check() {
                if (!navigator.onLine) return render();
                fetch(location.href, { cache: "no-store", headers: { "X-DE-Probe": "1" } })
                    .then(function (r) { if (r.ok || (r.status >= 400 && r.status < 500)) location.reload(); })
                    .catch(function () { });
            }

            retry.addEventListener("click", function () {
                retry.disabled = true;
                setTimeout(function () { retry.disabled = false; }, 1500);
                check();
            });
            window.addEventListener("online", function () { render(); check(); });
            window.addEventListener("offline", render);
            render();
            setInterval(check, 10000);
        })();
    </script>
</body>
</html>
